name: Nightly static and unit checks
run-name: core-checks:${{ github.sha }}
'on':
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: core-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run_full }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ANCHOR_JOBS: 'Core checks'
          CHECK_TITLE_PREFIX: core-checks
        run: node .github/scripts/nightly-candidate.cjs
  checks:
    name: Core checks
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Require exact default source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Retain exact resolved dependency graph for separate audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-lock-${{ github.sha }}
          path: composer.lock
          if-no-files-found: error
          retention-days: 7
      - run: composer test
  dependency-security:
    name: Dependency security audits
    needs: [select, checks]
    if: ${{ always() && !cancelled() && needs.select.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Confirm actual audit source
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: Read graph produced by this exact source's dependency install
        uses: actions/download-artifact@v4
        with:
          name: dependency-security-lock-${{ github.sha }}
      - name: Verify security result reporting
        run: node --test .github/scripts/dependency-security.test.cjs
      - name: Run dependency security audits independently of functional checks
        run: node .github/scripts/dependency-security.cjs
      - name: Retain security evidence even when audits fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-${{ github.sha }}
          path: output/dependency-security/
          if-no-files-found: warn
          retention-days: 30
